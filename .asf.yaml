github:
  description: "RocketMQ integration for Apache Flink. This module includes the RocketMQ source and sink that allows a flink job to either write messages into a topic or read from topics in a flink job."
  homepage: https://rocketmq.apache.org/
  labels:
    - streaming
    - cloud-native
    - rocketmq
  features:
    # Enable issue management
    issues: true
    # Enable wiki
    wiki: true
  protected_branches:
  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
notifications:
  commits: commits@rocketmq.apache.org
  issues: commits@rocketmq.apache.org
  pullrequests: commits@rocketmq.apache.org
  jobs: commits@rocketmq.apache.org
  discussions: dev@rocketmq.apache.org
